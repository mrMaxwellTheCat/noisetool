[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noisetool"
version = "1.0.0"
description = "High-quality noise generator (white, pink, brown) with LUFS normalization"
readme = "README.md"
authors = [
    {name = "mrMaxwellTheCat", email = "mrMaxwellTheCat@users.noreply.github.com"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
keywords = ["noise", "audio", "white-noise", "pink-noise", "brown-noise", "lufs"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/mrMaxwellTheCat/noise"
Repository = "https://github.com/mrMaxwellTheCat/noise"
Issues = "https://github.com/mrMaxwellTheCat/noise/issues"

[project.scripts]
noisetool = "noise.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "sounddevice>=0.4",
]
build = [
    "build>=1.0",
    "twine>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true
exclude = ["code/"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]
ignore = ["E501"]

[tool.interactive]
min_duration = 0.01
max_duration = 86400
min_sample_rate = 8000
max_sample_rate = 384000

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
